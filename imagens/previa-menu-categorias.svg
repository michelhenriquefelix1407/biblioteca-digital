  <text x="516" y="559" fill="#607069" font-family="Segoe UI, Arial, sans-serif" font-size="12">3 selecionadas</text>
  <text x="703" y="559" fill="#27715a" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Limpar</text>
