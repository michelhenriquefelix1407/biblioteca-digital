      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#152a24" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="cover-one" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c96f51"/>
      <stop offset="1" stop-color="#713c37"/>
    </linearGradient>
    <linearGradient id="cover-two" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#699b83"/>
      <stop offset="1" stop-color="#254c40"/>
    </linearGradient>
    <linearGradient id="cover-three" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d1aa58"/>
      <stop offset="1" stop-color="#855b2f"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="760" fill="#f3f5f4"/>
