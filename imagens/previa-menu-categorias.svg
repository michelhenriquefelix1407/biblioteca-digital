    <text x="87" y="592" fill="#263b33" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">O poder do hábito</text>
    <text x="87" y="617" fill="#607069" font-family="Segoe UI, Arial, sans-serif" font-size="12">Psicologia</text>

    <rect x="274" y="367" width="184" height="278" rx="7" fill="#fff" stroke="#dce3df"/>
    <rect x="286" y="379" width="160" height="184" rx="4" fill="url(#cover-two)"/>
    <circle cx="366" cy="471" r="52" fill="none" stroke="#d9d8aa" stroke-width="2" opacity=".8"/>
    <circle cx="366" cy="471" r="37" fill="none" stroke="#d9d8aa" stroke-width="1.5" opacity=".8"/>
    <text x="366" y="448" text-anchor="middle" fill="#f4f0d9" font-family="Georgia, serif" font-size="14" font-weight="700">Mentes</text>
    <text x="366" y="468" text-anchor="middle" fill="#f4f0d9" font-family="Georgia, serif" font-size="14" font-weight="700">perigosas</text>
    <text x="289" y="592" fill="#263b33" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Mentes perigosas</text>
    <text x="289" y="617" fill="#607069" font-family="Segoe UI, Arial, sans-serif" font-size="12">Psicologia</text>

