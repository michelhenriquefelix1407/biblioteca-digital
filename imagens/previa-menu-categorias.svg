  <text x="72" y="137" fill="#203d34" font-family="Georgia, serif" font-size="31" font-weight="700">Minha estante</text>
  <text x="72" y="167" fill="#607069" font-family="Segoe UI, Arial, sans-serif" font-size="15">Encontre livros por título, autor ou categoria.</text>

  <rect x="72" y="198" width="388" height="52" rx="7" fill="#fff" stroke="#cbd5cf"/>
