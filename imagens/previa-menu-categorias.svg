<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 760" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Prévia do filtro de múltiplas categorias da Biblioteca Digital Pessoal</title>
  <desc id="desc">Tela ilustrativa da biblioteca com um menu de categorias aberto, caixas de seleção e três categorias selecionadas.</desc>
  <defs>
