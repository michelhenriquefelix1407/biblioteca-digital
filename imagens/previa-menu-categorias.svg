  <text x="816" y="560" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Aplicar</text>

  <text x="72" y="315" fill="#203d34" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Livros</text>
  <text x="72" y="340" fill="#607069" font-family="Segoe UI, Arial, sans-serif" font-size="13">Resultados para as categorias selecionadas</text>

