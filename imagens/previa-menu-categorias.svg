    <path d="M103 520c24-48 62-67 121-79v108H103z" fill="#e1b685" opacity=".8"/>
    <text x="164" y="450" text-anchor="middle" fill="#fff5e8" font-family="Georgia, serif" font-size="17" font-weight="700">O poder</text>
